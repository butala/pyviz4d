[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyviz4d"
version = "0.1.0"
description = "4-D scientific spatio-temporal data visualization based on pure VTK"
authors = [
    { name = "Author Name", email = "author@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "vtk",
    "numpy",
    "matplotlib"
]

[project.optional-dependencies]
# core imports only: the four leaves below are imported lazily, so they are
# extras rather than hard requirements. See README "Optional extras".
earth = ["pooch"]                       # blue_marble.fetch (EarthViewer4D / earth_actor)
geo = ["pooch", "pyproj"]               # cityjson.read_cityjson + examples/demo_cityjson.py
video = ["imageio", "imageio[ffmpeg]"]  # Viewer4D.enable_recording (frames_dir and/or video_path)
all = ["pooch", "pyproj", "imageio", "imageio[ffmpeg]"]
dev = [
    "pytest",
    "pooch",
    "pyproj",
    "imageio",
    "imageio[ffmpeg]"
]
phiflow = [
    "phiflow",
    "scipy",
    "tqdm",
    "matplotlib",
    "jax"
]

[tool.setuptools.packages.find]
include = ["pyviz4d*"]
